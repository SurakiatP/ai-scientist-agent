[project]
name = "ai-scientist-client"
version = "0.1.0"
description = "Python client for the AI Scientist public API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_scientist_client"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
