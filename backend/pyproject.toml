[project]
name = "scientist"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "httpx",
    "boto3>=1.43.118",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scientist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
