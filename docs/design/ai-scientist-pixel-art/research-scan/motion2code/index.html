<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Scientist · Research Scan (motion2code)</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #061A23; overflow: hidden }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
</style>
</head>
<body>
<!--
Contract (motion2code):
- one stage at source resolution: viewBox 0 0 528 528 (research-scan.mp4 is 528x528, 4 fps, 8 frames, 2.000 s)
- window.anim = { tl, duration, seek(t), play(from), pause() }
- ?t=0.75 freezes at 0.75 s, ?external=1 does not autoplay (compare.html / renderers drive it)
- ?fps=4 holds every pose for 1/4 s, like the 4 fps source (default is smooth)
- ?still=1 draws the reduced-motion still (opening pose, dots lit, no clock)
- <html data-ready="1"> once the first frame is drawn. No fonts, no raster, no text.
- frame(2.0) === frame(0): the source already loops (first/last frame diff 2.67)

Shot list (source time, measured on frames; lens = glass centre in source px, size = lens frame width)
  0.00  lens (165,252) s92   start, parked at the left bracket; centre dot bright, side dots dim
  0.25  lens (209,257) s95   sweeps right over the left page; side dots light up, centre dot a little less
  0.50  lens (248,254) s95   crosses the spine; centre dot up (bob) and bright
  0.75  lens (337,270) s105  over the right page, drops toward the viewer; side dots bright
  1.00  lens (362,275) s110  far right, over the chart, widest; all dots dim (turnaround)
  1.25  lens (330,255) s100  comes back; all dots bright, centre dot up
  1.50  lens (211,257) s95   over the left page again
  1.75  lens (158,257) s92   almost home
  2.00  = 0.00               loop
The arm is a bar from the left bracket to a joint 25 px left of the lens frame; it grows and shrinks with the lens.

Palette (sampled with palette.py / pixel probes, one value per role)
-->
<svg id="stage" viewBox="0 0 528 528" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <clipPath id="frame"><rect width="528" height="528"/></clipPath>
    <!-- the glass opening, drawn around the lens origin; resized in render() -->
    <clipPath id="glassClip"><rect id="glassClipRect" x="-35" y="-35" width="70" height="70"/></clipPath>

    <!-- what is printed on the open book: reused as the page content and, magnified, inside the lens glass -->
    <g id="pageContent">
      <!-- left page text -->
      <g fill="#4689A5">
        <rect x="126" y="236" width="116" height="6"/><rect x="126" y="260" width="112" height="6"/>
        <rect x="126" y="286" width="120" height="6"/><rect x="126" y="312" width="104" height="6"/>
        <rect x="126" y="334" width="116" height="6"/>
      </g>
      <!-- right page text + chart -->
      <g fill="#4689A5">
        <rect x="292" y="236" width="112" height="6"/><rect x="292" y="264" width="34" height="6"/>
        <rect x="292" y="288" width="34" height="6"/><rect x="292" y="314" width="34" height="6"/>
        <rect x="292" y="334" width="38" height="6"/><rect x="336" y="334" width="76" height="6"/>
      </g>
      <g id="chart">
        <rect x="329" y="258" width="82" height="60" fill="#3F7FA0"/>
        <path d="M336 308 L346 290 L356 300 L368 280 L380 296 L390 284 L402 304" fill="none" stroke="#084C66" stroke-width="6" stroke-linejoin="miter"/>
      </g>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect id="bg" width="528" height="528" fill="#061A23"/>

    <!-- DATA DOTS: three squares with three small trail squares under them. Brightness set per frame in render() -->
    <g id="dots">
      <g id="dotL"><rect class="head" x="180" y="108" width="26" height="26"/><g class="trail"><rect x="188" y="151" width="8" height="8"/><rect x="188" y="179" width="8" height="8"/></g></g>
      <g id="dotC"><rect class="head" x="252" y="88" width="32" height="32"/><g class="trail"><rect x="262" y="129" width="8" height="8"/><rect x="262" y="155" width="8" height="8"/><rect x="262" y="176" width="8" height="8"/></g></g>
      <g id="dotR"><rect class="head" x="327" y="108" width="26" height="26"/><g class="trail"><rect x="337" y="151" width="8" height="8"/><rect x="337" y="179" width="8" height="8"/></g></g>
    </g>

    <!-- SCANNER BASE: slab under the book with two corner modules and a status bar -->
    <g id="base">
      <rect x="86" y="368" width="356" height="22" fill="#045467"/>
      <rect x="60" y="388" width="408" height="64" fill="#053C50"/>
      <rect x="112" y="398" width="304" height="48" fill="#033949"/>
      <rect x="132" y="408" width="264" height="12" fill="#031A23"/>
      <rect x="56" y="394" width="44" height="58" fill="#033949"/><rect x="56" y="394" width="44" height="6" fill="#066F82"/>
      <rect x="432" y="394" width="44" height="58" fill="#033949"/><rect x="432" y="394" width="44" height="6" fill="#066F82"/>
      <rect x="70" y="418" width="14" height="14" fill="#08F1E7"/><rect x="448" y="418" width="14" height="14" fill="#08F1E7"/>
      <g id="statusBar">
        <rect x="212" y="430" width="108" height="14" fill="#031A23"/>
        <g fill="#05DDD5"><rect x="214" y="432" width="14" height="10"/><rect x="232" y="432" width="14" height="10"/><rect x="250" y="432" width="14" height="10"/><rect x="268" y="432" width="14" height="10"/><rect x="286" y="432" width="14" height="10"/><rect x="304" y="432" width="14" height="10"/></g>
      </g>
    </g>

    <!-- DOCUMENT: open book, two pages, spine, page edges -->
    <g id="book">
      <polygon points="92,232 104,224 104,360 268,386 268,392 100,368 90,350" fill="#045467"/>
      <polygon points="436,236 424,226 424,356 268,386 268,392 432,368 442,350" fill="#045467"/>
      <polygon points="96,356 268,380 440,356 432,376 268,388 104,376" fill="#033949"/>
      <polygon points="100,226 264,212 264,366 106,348" fill="#DDEEEB"/>
      <polygon points="268,212 414,222 422,348 268,366" fill="#F1F7F4"/>
      <polygon points="106,348 264,366 264,376 108,358" fill="#BFDADD"/>
      <polygon points="268,366 422,348 420,358 268,376" fill="#BFDADD"/>
      <rect x="262" y="212" width="6" height="168" fill="#93B9BC"/>
      <use href="#pageContent"/>
    </g>

    <!-- LEFT BRACKET: post and ball the arm slides out of -->
    <g id="bracket">
      <g id="post"><rect class="pb" x="58" y="256" width="22" height="86" fill="#033949"/><rect class="pt" x="58" y="256" width="22" height="6" fill="#066F82"/><rect class="pl" x="58" y="256" width="5" height="86" fill="#045467"/></g>
      <rect x="54" y="332" width="30" height="30" fill="#033949"/><rect x="54" y="332" width="30" height="5" fill="#066F82"/>
    </g>

    <!-- ARM: bar from the bracket to the joint; x2 and y follow the lens -->
    <g id="arm">
      <rect id="armBar" x="72" y="270" width="200" height="28" fill="#01485A"/>
      <rect id="armTop" x="72" y="270" width="200" height="5" fill="#066E82"/>
      <g id="joint">
        <rect x="-19" y="-19" width="38" height="38" fill="#033949"/>
        <rect x="-19" y="-19" width="38" height="5" fill="#066F82"/>
        <rect x="-6" y="-6" width="12" height="12" fill="#19E0DA"/>
      </g>
    </g>

    <!-- LENS: frame, glass with magnified page content, glass highlight, four rivets. Drawn around its centre. -->
    <g id="lens">
      <rect id="lensFrame" x="-46" y="-46" width="92" height="92" fill="#0D2837"/>
      <rect id="lensRim" x="-46" y="-46" width="92" height="92" fill="none" stroke="#066F82" stroke-width="3"/>
      <rect id="glassBg" x="-35" y="-35" width="70" height="70" fill="#DFF0EE"/>
      <g clip-path="url(#glassClip)"><use id="glassContent" href="#pageContent"/></g>
      <rect id="glassTint" x="-35" y="-35" width="70" height="70" fill="#19E0DA" opacity="0.12"/>
      <rect id="glassEdge" x="-35" y="-35" width="70" height="70" fill="none" stroke="#19E0DA" stroke-width="3"/>
      <g id="rivets" fill="#10DADB"><rect id="rv1" width="6" height="6"/><rect id="rv2" width="6" height="6"/><rect id="rv3" width="6" height="6"/><rect id="rv4" width="6" height="6"/></g>
    </g>
  </g>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  const DUR = 2; // = source duration (ffprobe: 8 frames at 4 fps)

  // ---------- palette: one value per role ----------
  const C = {
    bg: '#061A23', dotDim: '#048090', dotBright: '#2AF9F9', trailDim: '#027C8F', trailBright: '#10E1DD',
  };

  // ---------- timing & size knobs (change these to retime / rescale) ----------
  const SPEED = 1;      // 1 = source speed. The whole clip is played at SPEED x.
  const LENS_SCALE = 1; // multiplies lens size (frame, glass) without touching the arm path
  let HOLD = 0;         // 0 = smooth motion. 4 = hold each pose for 1/4 s like the 4 fps source (?fps=4). Any value works.

  // ---------- keyframes, measured on the 8 source frames (see shot list above) ----------
  // [time, value, ease-to-next]
  const LENS_X = [[0,161],[.25,204],[.5,245],[.75,335],[1,363],[1.25,334],[1.5,214],[1.75,161],[2,161]];
  const LENS_Y = [[0,256],[.25,264],[.5,266],[.75,271],[1,283],[1.25,269],[1.5,265],[1.75,259],[2,256]];
  const LENS_S = [[0,99],[.25,105],[.5,100],[.75,104],[1,112],[1.25,105],[1.5,100],[1.75,99],[2,99]];
  // brightness 0..1 of each dot (0 = dim, 1 = bright), from the G channel of each frame
  const DOT_L = [[0,0],[.25,.73],[.5,.24],[.75,.98],[1,.03],[1.25,.96],[1.5,.08],[1.75,.07],[2,0]];
  const DOT_C = [[0,.68],[.25,1],[.5,1],[.75,.31],[1,.44],[1.25,1],[1.5,.96],[1.75,1],[2,.68]];
  const DOT_R = [[0,.06],[.25,.66],[.5,.52],[.75,.94],[1,.03],[1.25,.6],[1.5,.6],[1.75,.05],[2,.06]];
  // joint position relative to the lens centre, measured on the cyan joint dot of each frame
  const ARM_DX = [[0,-73],[.25,-67],[.5,-78],[.75,-75.5],[1,-81.5],[1.25,-82],[1.5,-70],[1.75,-68],[2,-73]];
  const ARM_DY = [[0,-1],[.25,-2.5],[.5,1.5],[.75,4],[1,3],[1.25,7],[1.5,0],[1.75,-4.5],[2,-1]];
  const BOB   = [[0,0],[.25,-6],[.5,-6],[.75,0],[1,0],[1.25,-6],[1.5,0],[1.75,0],[2,0]]; // centre dot lifts 6 px

  // ---------- helpers ----------
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const EC = {};
  const ease = n => EC[n] || (EC[n] = gsap.parseEase(n));
  function kf(t, K) {
    if (t <= K[0][0]) return K[0][1];
    for (let i = 1; i < K.length; i++) {
      if (t <= K[i][0]) {
        const [t0, v0] = K[i - 1], [t1, v1] = K[i];
        return lerp(v0, v1, ease(K[i][2] || 'none')(clamp((t - t0) / (t1 - t0))));
      }
    }
    return K[K.length - 1][1];
  }
  const f1 = v => (Math.round(v * 10) / 10).toString();
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, p) => { const A = hex(a), B = hex(b); return '#' + A.map((x, i) => Math.round(lerp(x, B[i], p)).toString(16).padStart(2, '0')).join(''); };
  const $ = id => document.getElementById(id);
  const el = {
    lens: $('lens'), lensFrame: $('lensFrame'), lensRim: $('lensRim'), glassBg: $('glassBg'), glassTint: $('glassTint'), glassEdge: $('glassEdge'),
    glassClipRect: $('glassClipRect'), glassContent: $('glassContent'), rv: ['rv1', 'rv2', 'rv3', 'rv4'].map($),
    armBar: $('armBar'), post: ['pb', 'pt', 'pl'].map(c => document.querySelector('#post .' + c)), armTop: $('armTop'), joint: $('joint'),
    dots: [['dotL', DOT_L], ['dotC', DOT_C], ['dotR', DOT_R]].map(([id, K]) => ({ g: $(id), K, head: $(id).querySelector('.head'), trail: $(id).querySelectorAll('.trail rect') })),
  };

  // ---------- render(t): pure function of t ----------
  function render(tt) {
    let t = ((tt * SPEED) % DUR + DUR) % DUR;
    if (HOLD) t = Math.floor(t * HOLD + 1e-6) / HOLD;
    const x = kf(t, LENS_X), y = kf(t, LENS_Y), s = kf(t, LENS_S) * LENS_SCALE, h = s / 2, gh = h - 18;

    // lens: frame, glass and rivets around its centre
    el.lens.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
    for (const r of [el.lensFrame, el.lensRim]) { r.setAttribute('x', f1(-h)); r.setAttribute('y', f1(-h)); r.setAttribute('width', f1(s)); r.setAttribute('height', f1(s)); }
    for (const r of [el.glassBg, el.glassTint, el.glassEdge, el.glassClipRect]) { r.setAttribute('x', f1(-gh)); r.setAttribute('y', f1(-gh)); r.setAttribute('width', f1(gh * 2)); r.setAttribute('height', f1(gh * 2)); }
    // the glass shows the same page content in place (same size), tinted by the glass layer
    el.glassContent.setAttribute('transform', `translate(${f1(-x)} ${f1(-y)})`);
    [[-h + 3, -h + 3], [h - 9, -h + 3], [-h + 3, h - 9], [h - 9, h - 9]].forEach(([rx, ry], i) => { el.rv[i].setAttribute('x', f1(rx)); el.rv[i].setAttribute('y', f1(ry)); });

    // arm: from the bracket to the joint, which rides to the left of the lens (ARM_DX / ARM_DY)
    const jx = x + kf(t, ARM_DX), jy = y + kf(t, ARM_DY);
    el.joint.setAttribute('transform', `translate(${f1(jx)} ${f1(jy)})`);
    for (const r of [el.armBar, el.armTop]) { r.setAttribute('x', 72); r.setAttribute('width', f1(Math.max(0, jx - 72))); }
    el.armBar.setAttribute('y', f1(jy - 14)); el.armTop.setAttribute('y', f1(jy - 14));
    // the bracket post hangs from the arm: its top follows the arm, its foot (the ball) stays put
    const top = jy - 14;
    el.post[0].setAttribute('y', f1(top)); el.post[0].setAttribute('height', f1(345 - top));
    el.post[1].setAttribute('y', f1(top));
    el.post[2].setAttribute('y', f1(top)); el.post[2].setAttribute('height', f1(345 - top));

    // data dots
    const bob = kf(t, BOB);
    el.dots.forEach((d, i) => {
      const b = kf(t, d.K), dy = i === 1 ? bob : bob * 0.4;
      d.g.setAttribute('transform', `translate(0 ${f1(dy)})`);
      d.head.setAttribute('fill', mix(C.dotDim, C.dotBright, b));
      const tc = mix(C.trailDim, C.trailBright, b);
      d.trail.forEach(r => r.setAttribute('fill', tc));
    });
  }

  // ---------- one timeline = the only clock ----------
  const clock = { t: 0 };
  const tl = gsap.timeline({ paused: true, repeat: -1 });
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => render(clock.t) }, 0);

  window.anim = {
    tl, duration: DUR,
    seek(t) { t = clamp(t, 0, DUR); tl.pause(); tl.time(t, true); render(t); },
    play(from = 0) { tl.time(from); tl.play(); },
    pause() { tl.pause(); },
  };

  const qs = new URLSearchParams(location.search);
  if (qs.has('fps')) HOLD = parseFloat(qs.get('fps')) || 0;
  anim.seek(0);
  if (qs.has('still')) anim.seek(0); // reduced-motion still: the opening pose
  else if (qs.has('t')) anim.seek(parseFloat(qs.get('t')));
  else if (!qs.has('external')) tl.play(0);
  document.documentElement.dataset.ready = '1';
})();
</script>
</body>
</html>
