name: Verify
on:
  push: { branches: [main, develop] }
  pull_request:
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { version: "0.8.17" }
      - run: uv sync --locked --project backend
      - run: uv run --locked --project backend pytest -q backend/tests
  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate compose file
        run: |
          mkdir -p /tmp/p && touch /tmp/p/minio-access-key /tmp/p/minio-secret-key /tmp/app.env
          PRIVATE_DIR=/tmp/p APP_ENV_FILE=/tmp/app.env docker compose -f infra/compose.yaml config -q
