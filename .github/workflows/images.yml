name: Images
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/<repo>/<image>
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:develop
            ${{ steps.meta.outputs.repo }}:sha-${{ steps.meta.outputs.short }}
      - run: echo "${{ matrix.image }} ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
