# Single-VM stack. Run: docker compose -f infra/compose.yaml --env-file /etc/ai-scientist/private/app.env up -d
# Local build instead of pulling: add `--build`.
name: ai-scientist

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  backend:
    <<: *hardening
    image: ghcr.io/surakiatp/ai-scientist-agent/backend:${IMAGE_TAG:-develop}
    build: { context: .., dockerfile: backend/Dockerfile }
    # OPENROUTER_API_KEY, MODEL, ... come from an env file kept outside the repo; never baked into the image.
    env_file: ${APP_ENV_FILE:-/etc/ai-scientist/private/app.env}
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      DATABASE_URL: postgresql://app@postgres:5432/app  # password comes from the secret file, never from the URL
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
      CORS_ORIGINS: '["https://${DOMAIN:-localhost}"]'
      ALLOWED_ORIGINS: '["https://${DOMAIN:-localhost}"]' # store writes carrying another Origin get 403
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1} # uvicorn reads this itself; set to Caddy's address/CIDR so the rate limit is per real client
      HERMES_SOURCE_PATH: /home/app/.cache/scientist/upstream/hermes
      # Isolated runner (see `sandbox` below): the backend only holds a client cert for its TLS port, never the host Docker socket.
      DOCKER_HOST: tcp://sandbox:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      HERMES_RUNTIME_DIR: /srv/sandbox-share/hermes-home # same path inside the sandbox, so bind mounts of branch/analysis dirs resolve there
      SANDBOX_WORK_DIR: /srv/sandbox-share/work
      SANDBOX_IMAGE: ghcr.io/surakiatp/ai-scientist-agent/sandbox:${IMAGE_TAG:-develop}
      APP_VERSION: ${APP_VERSION:-${IMAGE_TAG:-develop}}  # shown in each answer's provenance
    secrets: [minio_access_key, minio_secret_key, postgres_app_password]
    networks: [default, db, sandbox]
    volumes:
      # Pinned Hermes + skills checkout built by bootstrap.sh (outside the repo).
      - ${SCIENTIST_CACHE_DIR:-/var/lib/ai-scientist/cache}:/home/app/.cache/scientist:ro
      - sandbox-share:/srv/sandbox-share
      - sandbox-client:/certs/client:ro  # a copy made by sandbox-init, NOT dind's own cert dir (see sandbox-init)
    read_only: true
    # /tmp holds Starlette's multipart spool: must exceed the largest upload cap (100 MB csv/parquet). RAM-backed.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    expose: ["8000"]
    depends_on:
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      sandbox-init: { condition: service_completed_successfully }  # fail fast: the stack needs the sandbox runner; deploy.sh rolls back if health fails
    # No host Docker socket on purpose. Research branches (hermes.py SANDBOX_IMAGE) and data analysis run as containers in
    # the nested daemon of `sandbox`, reached over mTLS (tcp://sandbox:2376); the shared volume carries their files.

  # Isolated runner: Docker-in-Docker under the sysbox runtime (user-namespaced root, no extra host privileges), so a container
  # escape lands in a throwaway uid range, not on the VM. Requires sysbox-runc installed on the host (docs/deploy.md).
  # NOT on the `hardening` anchor: dockerd needs capabilities (SYS_ADMIN, NET_ADMIN, ...) inside its sysbox user
  # namespace, and cap_drop ALL would stop it from starting. no-new-privileges is kept; sysbox confines the rest.
  # Pinned: docker:28.5.2-dind index digest, resolved 2026-10-29 via `docker buildx imagetools inspect docker:28.5.2-dind`.
  # Limits, worst case: MAX_CONCURRENT_RUNS (4) x MAX_BRANCHES (5) = 20 branch containers x (1 CPU, 512 MB) = 20 CPU / 10 GB,
  # plus SANDBOX_MAX_CONCURRENT (3) analyses x 2 GB = 6 GB, so 16 GB and about 23 CPUs at the theoretical maximum. The defaults
  # below (6g / 3 CPUs) leave headroom on a modest 8 GB / 4 CPU VM for postgres, backend, minio and caddy, and do NOT cover that maximum: under load runs slow down or get OOM-killed
  # inside the sandbox instead of starving the host. Raise SANDBOX_MEM_LIMIT / SANDBOX_CPUS / SANDBOX_PIDS_LIMIT on a bigger VM;
  # LOWER SANDBOX_CPUS on a host with fewer than 3 CPUs (Docker rejects cpus above the host CPU count).
  sandbox:
    image: docker:28.5.2-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
    runtime: sysbox-runc
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    # The dind entrypoint puts the container hostname into the server cert's SAN. Compose's service name is only a
    # network alias, so without this the cert names the container id and `tcp://sandbox:2376` fails to verify.
    hostname: sandbox
    # Wrapper adds the egress filter: agent code in branch containers has internet egress, and the private ranges hold the
    # backend (no login, full data access), the VM host and cloud metadata (169.254.169.254). See deploy/sandbox-entrypoint.sh.
    entrypoint: ["sh", "/sandbox-entrypoint.sh"]
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_IPTABLES_LEGACY: ""  # set-but-empty makes dind use nft (the `iptables` the filter and healthcheck call); non-empty would force legacy
    volumes:
      - ./deploy/sandbox-entrypoint.sh:/sandbox-entrypoint.sh:ro
      - sandbox-certs:/certs
      - sandbox-share:/srv/sandbox-share:ro  # the daemon only reads bind-mount sources (sandbox-init creates the dirs); root in an untrusted workload must not rewrite the backend's Hermes home
      - sandbox-docker:/var/lib/docker
    networks: [sandbox, sandbox-egress]
    mem_limit: ${SANDBOX_MEM_LIMIT:-6g}
    cpus: ${SANDBOX_CPUS:-3}
    pids_limit: ${SANDBOX_PIDS_LIMIT:-4096}
    healthcheck:
      test: ["CMD-SHELL", "DOCKER_HOST=tcp://localhost:2376 DOCKER_TLS_VERIFY=1 DOCKER_CERT_PATH=/certs/client docker version && iptables -C FORWARD -j DOCKER-USER && iptables -C DOCKER-USER -d 169.254.0.0/16 -j DROP"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  # One-shot: copies the client cert into its own volume for the backend user (uid 10001 only), creates the shared dirs and pre-pulls both images
  # dind re-chmods /certs/client/key.pem to 0644 on every start and keeps /certs/client at 1777, so the backend must never
  # mount that dir; it gets the copy in `sandbox-client`. The CA key persists in `sandbox-certs`, so the copy stays valid
  # across sandbox restarts; any `compose up` re-copies it.
  # (the sandbox network is internal, so pulls go through the daemon's own egress). Same docker:28.5.2-cli digest as backend/Dockerfile.
  sandbox-init:
    image: docker:28.5.2-cli@sha256:625d9431a9f54c5a2bc90f24f0e1c3d55b1349fd857dd85035f98c2c9acbdd4d
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]  # install -o 10001 / chown on the volumes; the dind certs are world-readable so no DAC_OVERRIDE
    entrypoint: ["sh", "/sandbox-init.sh"]
    environment:
      DOCKER_HOST: tcp://sandbox:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      ANALYSIS_IMAGE: ghcr.io/surakiatp/ai-scientist-agent/sandbox:${IMAGE_TAG:-develop}
    volumes:
      - ./deploy/sandbox-init.sh:/sandbox-init.sh:ro
      - sandbox-certs:/certs:ro
      - sandbox-client:/client-out
      - sandbox-share:/srv/sandbox-share
    networks: [sandbox]
    read_only: true
    depends_on: { sandbox: { condition: service_healthy } }

  frontend:
    <<: *hardening
    image: ghcr.io/surakiatp/ai-scientist-agent/frontend:${IMAGE_TAG:-develop}
    build: { context: .., dockerfile: frontend/Dockerfile, args: { NEXT_PUBLIC_API_BASE: "" } }
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    expose: ["3000"]

  minio:
    <<: *hardening
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret_key
      MINIO_API_CORS_ALLOW_ORIGIN: https://${DOMAIN:-localhost} # presigned previews are fetched cross-origin from files.${DOMAIN}
    secrets: [minio_access_key, minio_secret_key]
    ports: ["127.0.0.1:${MINIO_PORT:-59000}:9000"] # loopback only; no console port
    volumes: [minio_data:/data]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: applies Alembic migrations with the backend image before the backend starts. Migrations are forward-only:
  # to go back, restore the pg_dump taken by deploy.sh (docs/deploy.md), never `alembic downgrade` in production.
  migrate:
    <<: *hardening
    image: ghcr.io/surakiatp/ai-scientist-agent/backend:${IMAGE_TAG:-develop}
    restart: "no"
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    env_file: ${APP_ENV_FILE:-/etc/ai-scientist/private/app.env}
    environment:
      DATABASE_URL: postgresql://app@postgres:5432/app
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets: [postgres_app_password]
    networks: [db]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    depends_on: { postgres: { condition: service_healthy } }

  # PostgreSQL: NOT published and on an internal-only network (no login in the app: never expose it publicly).
  # Pinned by the multi-arch index digest of postgres:17-alpine (17.11) resolved with `docker buildx imagetools inspect`.
  postgres:
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]  # only what the entrypoint needs to chown PGDATA and drop to uid 70
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    # Wrapper (root, before the image entrypoint) exports the app-role password for postgres-init.sh from its secret file.
    entrypoint: ["sh", "-c", "APP_PW=$$(cat /run/secrets/postgres_app_password) && export APP_PW && exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000", "-c", "idle_session_timeout=600000", "-c", "log_connections=on"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256  # no trust auth, not even on the local socket
    secrets: [postgres_password, postgres_app_password]
    networks: [db]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m", "/run/postgresql:rw,noexec,nosuid,size=1m,uid=70,gid=70"]
    shm_size: 128m
    mem_limit: 1g
    pids_limit: 200
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      interval: 5s
      timeout: 3s
      retries: 12

  caddy:
    <<: *hardening
    image: caddy:2.10.0-alpine
    cap_add: [NET_BIND_SERVICE]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CADDY_TLS: ${CADDY_TLS:-}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend, minio]

secrets:
  minio_access_key: { file: "${PRIVATE_DIR:-/etc/ai-scientist/private}/minio-access-key" }
  minio_secret_key: { file: "${PRIVATE_DIR:-/etc/ai-scientist/private}/minio-secret-key" }
  postgres_password: { file: "${PRIVATE_DIR:-/etc/ai-scientist/private}/postgres-password" }          # superuser, postgres container only
  postgres_app_password: { file: "${PRIVATE_DIR:-/etc/ai-scientist/private}/postgres-app-password" }  # role `app`, also read by backend + migrate

networks:
  db: { internal: true }  # postgres, migrate and backend only; no route to the internet or the host
  sandbox: { internal: true }  # backend <-> sandbox daemon (2376, client cert required); no route out
  sandbox-egress: {}  # sandbox only: lets the nested daemon pull images and branch containers reach the internet

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
  sandbox-certs:  # dind CA + server + client certs
  sandbox-share:  # hermes-home + analysis work dir, same path in backend and sandbox
  sandbox-client:  # client ca/cert/key copy owned by uid 10001, mounted read-only in the backend
  sandbox-docker:  # nested daemon's images and layers
