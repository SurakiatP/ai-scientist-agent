# Single-VM stack. Run: docker compose -f infra/compose.yaml --env-file /etc/ai-scientist/private/app.env up -d
# Local build instead of pulling: add `--build`.
name: ai-scientist

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  backend:
    <<: *hardening
    image: ghcr.io/surakiatp/ai-scientist-agent/backend:${IMAGE_TAG:-develop}
    build: { context: .., dockerfile: backend/Dockerfile }
    # OPENROUTER_API_KEY, MODEL, ... come from an env file kept outside the repo; never baked into the image.
    env_file: ${APP_ENV_FILE:-/etc/ai-scientist/private/app.env}
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      CORS_ORIGINS: '["https://${DOMAIN:-localhost}"]'
      HERMES_SOURCE_PATH: /home/app/.cache/scientist/upstream/hermes
    secrets: [minio_access_key, minio_secret_key]
    volumes:
      # Pinned Hermes + skills checkout built by bootstrap.sh (outside the repo).
      - ${SCIENTIST_CACHE_DIR:-/var/lib/ai-scientist/cache}:/home/app/.cache/scientist:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    expose: ["8000"]
    depends_on: { minio: { condition: service_healthy } }
    # No host Docker socket here on purpose. Branch sandboxes (hermes.py SANDBOX_IMAGE) need a separate,
    # isolated runner, e.g. a rootless-docker/sysbox `analysis-sandbox` service. Not implemented yet:
    # analysis-sandbox:
    #   image: <TBD>

  frontend:
    <<: *hardening
    image: ghcr.io/surakiatp/ai-scientist-agent/frontend:${IMAGE_TAG:-develop}
    build: { context: .., dockerfile: frontend/Dockerfile, args: { NEXT_PUBLIC_API_BASE: "" } }
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    expose: ["3000"]

  minio:
    <<: *hardening
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret_key
    secrets: [minio_access_key, minio_secret_key]
    ports: ["127.0.0.1:${MINIO_PORT:-59000}:9000"] # loopback only; no console port
    volumes: [minio_data:/data]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    user: "10001:10001"
    group_add: ["${SECRETS_GID:-0}"] # file secrets keep host owner/mode; see docs/deploy.md
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  caddy:
    <<: *hardening
    image: caddy:2.10.0-alpine
    cap_add: [NET_BIND_SERVICE]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CADDY_TLS: ${CADDY_TLS:-}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend]

secrets:
  minio_access_key: { file: "${PRIVATE_DIR:-/etc/ai-scientist/private}/minio-access-key" }
  minio_secret_key: { file: "${PRIVATE_DIR:-/etc/ai-scientist/private}/minio-secret-key" }

volumes:
  minio_data:
  caddy_data:
  caddy_config:
